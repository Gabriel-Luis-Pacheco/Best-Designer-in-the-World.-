<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formulário de teste</title><style>body{font:16px/1.55 system-ui;color:#142b36;background:#f5f7f8}main{max-width:430px;margin:10vh auto;padding:24px;background:white;border-radius:12px;box-shadow:0 5px 30px #0001}label,input,button{display:block;width:100%;box-sizing:border-box}label{font-weight:600}input,button{font:inherit;margin:8px 0 22px;padding:12px}button{border:0;background:#17496e;color:white;border-radius:6px}input:focus,button:focus{outline:3px solid #f0ad36;outline-offset:2px}</style></head><body><main><h1>Receber novidades</h1><p>Projeto de teste. Não envia emails reais.</p><form id="f"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><button type="submit">Cadastrar</button><p id="feedback" aria-live="polite"></p></form></main><script>document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();document.getElementById('feedback').textContent='Falha de rede. Tente novamente.';});</script></body></html>
