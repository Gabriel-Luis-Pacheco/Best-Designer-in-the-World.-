name: Validate Design OS
on:
  push:
  pull_request:
jobs:
  structure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate example product contracts
        run: python scripts/check_contracts.py
      - name: Validate manifests and portable references
        run: python scripts/check_evals.py
      - name: Validate release documentation
        run: python scripts/check_docs.py
      - name: Validate isolated installed skill
        run: python skills/studio-grade-web-transformation/scripts/validate.py
      - name: Audit static synthetic markup (informational, non-WCAG)
        run: python skills/studio-grade-web-transformation/scripts/inspect_html.py skills/studio-grade-web-transformation/examples/conversaboa-concept.html
      - name: Check product-intelligence routing examples
        run: python scripts/verify_brain_examples.py
      - name: Test validation logic
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
  browser-fixtures:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Playwright dependency
        run: npm install --no-audit --no-fund
      - name: Install Chromium for browser fixture tests
        run: npx playwright install --with-deps chromium
      - name: Test browser fixtures
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-fixture-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
