name: Import Revenue-Centric Design (one-time)
on:
  push:
    branches:
      - import/revenue-centric-design-20261111

permissions:
  contents: write

jobs:
  import-source-completely:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Clone source at pinned revision and copy full tracked tree
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/heliocosta-dev/revenue-centric-design.git /tmp/revenue-centric-design-upstream
          test "$(git -C /tmp/revenue-centric-design-upstream rev-parse HEAD)" = "1942760c2242f609bf63ce2c97204f5a1791bd68"
          mkdir -p skills/studio-grade-web-transformation/vendor/revenue-centric-design
          rsync -a --exclude=".git" /tmp/revenue-centric-design-upstream/ skills/studio-grade-web-transformation/vendor/revenue-centric-design/

      - name: Verify exact byte-for-byte copy and integrate skill instructions
        run: python .github/scripts/complete_revenue_centric_import.py

      - name: Commit full source and integrated instructions
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/import-revenue-centric-design.yml
          rm .github/scripts/complete_revenue_centric_import.py
          rmdir .github/scripts 2>/dev/null || true
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "feat: integrate complete Revenue-Centric Design skill with license and references"
          git push origin HEAD:import/revenue-centric-design-20261111
