name: Sync full third-party skill directories

on:
  push:
    branches:
      - feature/vendor-50-complete-skills-20261118
    paths:
      - "scripts/sync_external_skill_packs.py"
      - "skills/studio-grade-web-transformation/vendor/external-skill-packs/SOURCES.json"
      - ".github/workflows/sync-external-skill-packs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vendor-50-skill-packs
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate the curated 50-skill manifest
        run: python3 scripts/sync_external_skill_packs.py --validate
      - name: Download and vendor complete upstream skill folders
        run: python3 scripts/sync_external_skill_packs.py --sync
      - name: Verify 50 source folders and attribution
        run: python3 scripts/sync_external_skill_packs.py --check
      - name: Commit new upstream snapshots to the integration branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/studio-grade-web-transformation/vendor/external-skill-packs
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "vendor: include complete source folders for 50 design and marketing skills"
          git push origin "HEAD:$GITHUB_REF_NAME"
